<!DOCTYPE html>
<html>
<head>
  <script>
  console.log(window.innerWidth);
    if (window.innerWidth < 768) {
      // User is on mobile → redirect
      window.location.href = "mobile/mobile.html";
    } else {
      // Desktop → stay or redirect elsewhere
      window.location.href = "desktop/desktop.html";
    }
  </script>
</head>

</html>
